name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master # Soporte para repositorios que usen 'master' o 'main'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies 🔧
        run: npm ci

      - name: Build 🏗️
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # La carpeta generada por Vite que contiene los archivos limpios
          branch: gh-pages # Rama de GitHub Pages donde se publicará el sitio compileado
